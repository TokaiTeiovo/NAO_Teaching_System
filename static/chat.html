<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能对话系统 - 多模态智能教学系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #764ba2, #667eea);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .chat-container {
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            background: #f8fafc;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-left: auto;
        }

        .message.assistant {
            background: #e2e8f0;
            color: #4a5568;
        }

        .message.system {
            background: #fed7d7;
            color: #9b2c2c;
            text-align: center;
            margin: 0 auto;
        }

        .message .timestamp {
            font-size: 0.8em;
            opacity: 0.7;
            margin-top: 5px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .voice-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-btn:hover {
            transform: scale(1.05);
        }

        .voice-btn.recording {
            background: linear-gradient(135deg, #e53e3e, #c53030);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .voice-status {
            font-size: 0.9em;
            color: #718096;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .emotion-display {
            background: #f8fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .emotion-item {
            text-align: center;
            padding: 8px;
            background: white;
            border-radius: 5px;
            border: 1px solid #e2e8f0;
        }

        .emotion-name {
            font-size: 0.9em;
            font-weight: bold;
            color: #4a5568;
        }

        .emotion-value {
            font-size: 1.1em;
            color: #667eea;
        }

        .learning-states {
            margin-top: 15px;
        }

        .state-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .progress-bar {
            width: 100px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background: #48bb78;
            box-shadow: 0 0 10px rgba(72, 187, 120, 0.5);
        }

        .status-dot.disconnected {
            background: #f56565;
        }

        .recording-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(229, 62, 62, 0.1);
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            background: #e53e3e;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .nav-buttons {
                flex-direction: column;
                align-items: center;
            }

            .input-container {
                flex-direction: column;
                gap: 15px;
            }

            .voice-controls {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <div class="header">
            <h1>🎤 智能对话系统</h1>
            <p>语音输入转文字，情感识别，与AI助教智能对话</p>
            <div class="nav-buttons">
                <a href="/index.html" class="nav-btn">知识图谱</a>
                <a href="/chat.html" class="nav-btn active">智能对话</a>
            </div>
        </div>

        <div class="main-grid">
            <!-- 对话界面 -->
            <div class="panel chat-container">
                <h2>💬 智能对话</h2>

                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">未连接到AI服务器</span>
                    <button class="btn btn-secondary" onclick="connectToServer()" style="margin-left: auto;">连接服务器</button>
                </div>

                <div class="recording-indicator" id="recordingIndicator">
                    <div class="recording-dot"></div>
                    <span>正在录音... 点击停止</span>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="message system">
                        <div>欢迎使用智能对话系统！</div>
                        <div>您可以使用语音输入或文字输入与AI助教对话</div>
                        <div class="timestamp">系统启动时间: <span id="startTime"></span></div>
                    </div>
                </div>

                <div class="input-container">
                    <div class="voice-controls">
                        <button class="voice-btn" id="voiceBtn" onclick="toggleRecording()" title="语音输入">
                            🎤
                        </button>
                        <div class="voice-status" id="voiceStatus">点击开始录音</div>
                    </div>

                    <input type="text" id="messageInput" placeholder="输入您的问题或使用语音输入..."
                           onkeypress="handleKeyPress(event)">

                    <button class="btn btn-primary" onclick="sendMessage()" id="sendButton">
                        发送
                    </button>
                </div>
            </div>

            <!-- 情感分析面板 -->
            <div class="panel">
                <h2>😊 情感分析</h2>

                <div class="emotion-display">
                    <h3 style="margin-bottom: 10px;">当前情感状态</h3>
                    <div id="currentEmotion" style="font-size: 1.5em; text-align: center; color: #667eea;">
                        中性 😐
                    </div>
                    <div id="emotionConfidence" style="text-align: center; color: #718096; margin-top: 5px;">
                        置信度: 0%
                    </div>
                </div>

                <div class="emotion-grid" id="emotionGrid">
                    <!-- 情感概率分布将在这里动态生成 -->
                </div>

                <div class="learning-states">
                    <h3 style="margin-bottom: 10px;">学习状态评估</h3>
                    <div class="state-item">
                        <span>注意力:</span>
                        <div>
                            <span id="attentionValue">50%</span>
                            <div class="progress-bar">
                                <div class="progress-fill" id="attentionBar" style="width: 50%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="state-item">
                        <span>参与度:</span>
                        <div>
                            <span id="engagementValue">50%</span>
                            <div class="progress-bar">
                                <div class="progress-fill" id="engagementBar" style="width: 50%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="state-item">
                        <span>理解度:</span>
                        <div>
                            <span id="understandingValue">50%</span>
                            <div class="progress-bar">
                                <div class="progress-fill" id="understandingBar" style="width: 50%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class VoiceChatSystem {
            constructor() {
                this.websocket = null;
                this.isConnected = false;
                this.isRecording = false;
                this.mediaRecorder = null;
                this.audioChunks = [];
                this.recognition = null;
                this.startTime = new Date();

                this.initializeUI();
                this.initializeSpeechRecognition();
            }

            initializeUI() {
                document.getElementById('startTime').textContent = this.startTime.toLocaleString();
                this.updateConnectionStatus();
            }

            initializeSpeechRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();

                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    this.recognition.lang = 'zh-CN';

                    this.recognition.onstart = () => {
                        document.getElementById('voiceStatus').textContent = '正在识别语音...';
                    };

                    this.recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        document.getElementById('messageInput').value = transcript;
                        document.getElementById('voiceStatus').textContent = `识别结果: ${transcript}`;

                        // 自动发送识别的文字
                        setTimeout(() => {
                            this.sendMessage();
                        }, 1000);
                    };

                    this.recognition.onerror = (event) => {
                        document.getElementById('voiceStatus').textContent = `语音识别错误: ${event.error}`;
                        this.stopRecording();
                    };

                    this.recognition.onend = () => {
                        this.stopRecording();
                    };
                } else {
                    document.getElementById('voiceStatus').textContent = '浏览器不支持语音识别';
                }
            }

            async connectToServer() {
                const serverUrl = 'ws://localhost:8765';

                try {
                    this.addSystemMessage('正在连接到AI服务器...');

                    this.websocket = new WebSocket(serverUrl);

                    this.websocket.onopen = () => {
                        this.isConnected = true;
                        this.updateConnectionStatus();
                        this.addSystemMessage('已成功连接到AI服务器！');
                    };

                    this.websocket.onmessage = (event) => {
                        this.handleServerMessage(JSON.parse(event.data));
                    };

                    this.websocket.onclose = () => {
                        this.isConnected = false;
                        this.updateConnectionStatus();
                        this.addSystemMessage('与AI服务器的连接已断开');
                    };

                    this.websocket.onerror = (error) => {
                        console.error('WebSocket错误:', error);
                        this.addSystemMessage('连接错误: 无法连接到AI服务器');
                    };

                } catch (error) {
                    console.error('连接失败:', error);
                    this.addSystemMessage('连接失败: ' + error.message);
                }
            }

            toggleRecording() {
                if (!this.isRecording) {
                    this.startRecording();
                } else {
                    this.stopRecording();
                }
            }

            startRecording() {
                if (!this.recognition) {
                    document.getElementById('voiceStatus').textContent = '语音识别不可用';
                    return;
                }

                this.isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
                document.getElementById('voiceBtn').textContent = '⏹️';
                document.getElementById('recordingIndicator').style.display = 'flex';
                document.getElementById('voiceStatus').textContent = '正在录音...';

                try {
                    this.recognition.start();
                } catch (error) {
                    console.error('录音启动失败:', error);
                    this.stopRecording();
                }
            }

            stopRecording() {
                this.isRecording = false;
                document.getElementById('voiceBtn').classList.remove('recording');
                document.getElementById('voiceBtn').textContent = '🎤';
                document.getElementById('recordingIndicator').style.display = 'none';

                if (this.recognition) {
                    this.recognition.stop();
                }

                if (document.getElementById('voiceStatus').textContent === '正在录音...') {
                    document.getElementById('voiceStatus').textContent = '点击开始录音';
                }
            }

            sendMessage() {
                const input = document.getElementById('messageInput');
                const message = input.value.trim();

                if (!message || !this.isConnected) {
                    return;
                }

                // 显示用户消息
                this.addUserMessage(message);

                // 清空输入框
                input.value = '';

                // 发送到服务器进行情感分析和对话生成
                const messageData = {
                    type: 'text',
                    id: this.generateMessageId(),
                    data: {
                        text: message,
                        context: {
                            timestamp: Date.now(),
                            session_id: 'voice_chat_session',
                            analyze_emotion: true
                        }
                    }
                };

                this.websocket.send(JSON.stringify(messageData));
            }

            handleServerMessage(data) {
                console.log('收到服务器消息:', data);

                if (data.type === 'text_result') {
                    // AI回复消息
                    this.addAssistantMessage(data.data.text || '收到回复但内容为空');
                } else if (data.type === 'emotion_result') {
                    // 情感分析结果
                    this.updateEmotionDisplay(data.data);
                } else if (data.type === 'server_info') {
                    // 服务器信息
                    this.addSystemMessage(data.data.message || '收到服务器信息');
                } else if (data.type === 'error') {
                    // 错误消息
                    this.addSystemMessage('错误: ' + (data.data.message || '未知错误'));
                }
            }

            updateEmotionDisplay(emotionData) {
                if (!emotionData) return;

                // 更新主要情感显示
                if (emotionData.emotion) {
                    const emotionIcons = {
                        '愤怒': '😠', '厌恶': '🤢', '恐惧': '😨',
                        '喜悦': '😊', '中性': '😐', '悲伤': '😢', '惊讶': '😲'
                    };

                    const icon = emotionIcons[emotionData.emotion] || '😐';
                    document.getElementById('currentEmotion').textContent = `${emotionData.emotion} ${icon}`;
                }

                if (emotionData.confidence) {
                    document.getElementById('emotionConfidence').textContent =
                        `置信度: ${(emotionData.confidence * 100).toFixed(1)}%`;
                }

                // 更新情感概率分布
                if (emotionData.emotions) {
                    const emotionGrid = document.getElementById('emotionGrid');
                    emotionGrid.innerHTML = '';

                    Object.entries(emotionData.emotions).forEach(([emotion, value]) => {
                        const percentage = (value * 100).toFixed(1);
                        const emotionItem = document.createElement('div');
                        emotionItem.className = 'emotion-item';
                        emotionItem.innerHTML = `
                            <div class="emotion-name">${emotion}</div>
                            <div class="emotion-value">${percentage}%</div>
                        `;
                        emotionGrid.appendChild(emotionItem);
                    });
                }

                // 更新学习状态
                if (emotionData.learning_states) {
                    Object.entries(emotionData.learning_states).forEach(([state, value]) => {
                        const percentage = (value * 100).toFixed(0);
                        const stateName = state === '注意力' ? 'attention' :
                                        state === '参与度' ? 'engagement' : 'understanding';

                        const valueElement = document.getElementById(`${stateName}Value`);
                        const barElement = document.getElementById(`${stateName}Bar`);

                        if (valueElement && barElement) {
                            valueElement.textContent = `${percentage}%`;
                            barElement.style.width = `${percentage}%`;
                        }
                    });
                }
            }

            addUserMessage(text) {
                this.addMessage('user', '👤 您', text);
            }

            addAssistantMessage(text) {
                this.addMessage('assistant', '🤖 AI助教', text);
            }

            addSystemMessage(text) {
                this.addMessage('system', '🔧 系统', text);
            }

            addMessage(type, sender, text) {
                const messagesContainer = document.getElementById('chatMessages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;

                messageDiv.innerHTML = `
                    <div><strong>${sender}:</strong> ${this.escapeHtml(text)}</div>
                    <div class="timestamp">${new Date().toLocaleTimeString()}</div>
                `;

                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            updateConnectionStatus() {
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');

                if (this.isConnected) {
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = '已连接到AI服务器';
                } else {
                    statusDot.className = 'status-dot disconnected';
                    statusText.textContent = '未连接到AI服务器';
                }
            }

            generateMessageId() {
                return 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            handleKeyPress(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    this.sendMessage();
                }
            }
        }

        // 全局实例
        let voiceChatSystem;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            voiceChatSystem = new VoiceChatSystem();

            // 绑定全局函数
            window.connectToServer = () => voiceChatSystem.connectToServer();
            window.toggleRecording = () => voiceChatSystem.toggleRecording();
            window.sendMessage = () => voiceChatSystem.sendMessage();
            window.handleKeyPress = (event) => voiceChatSystem.handleKeyPress(event);
        });

        // 页面卸载时清理连接
        window.addEventListener('beforeunload', function() {
            if (voiceChatSystem && voiceChatSystem.websocket) {
                voiceChatSystem.websocket.close();
            }
        });
    </script>
</body>
</html>
